[package]
name = "tilo"
version = "0.2.1"
edition = "2024"

[dependencies]
cairo-rs = "0.22"
libc = "0.2"
pangocairo = "0.22"
thiserror = "2.0.21"
x11rb = { version = "0.14.0", features = ["randr", "cursor", "resource_manager"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
