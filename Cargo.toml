[package]
name = "tilo"
version = "0.2.7"
edition = "2024"

[dependencies]
fontdue = "0.9.4"
libc = "0.2"
thiserror = "2.0.21"
x11rb = { version = "0.14.0", features = ["randr", "cursor", "resource_manager", "xinerama"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
