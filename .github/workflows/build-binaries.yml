name: Build Binaries (Standalone)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.short_name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            short_name: x86_64-gnu
          - target: x86_64-unknown-linux-musl
            short_name: x86_64-musl
          - target: i686-unknown-linux-gnu
            short_name: i686-gnu
          - target: i686-unknown-linux-musl
            short_name: i686-musl
          - target: aarch64-unknown-linux-gnu
            short_name: arm64-gnu
          - target: aarch64-unknown-linux-musl
            short_name: arm64-musl
          - target: armv7-unknown-linux-musleabihf
            short_name: arm32-musl

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        uses: taiki-e/install-action@cross

      - name: Build target binary
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Package standalone archive
        run: |
          mkdir -p dist/artifacts
          ./scripts/packaging/binary/pkg-bin.sh \
            --binary "target/${{ matrix.target }}/release/tilo" \
            --target "${{ matrix.target }}" \
            --out-dir dist/artifacts

      - name: Upload binary archive
        uses: actions/upload-artifact@v7
        with:
          name: tilo-bin-${{ matrix.short_name }}
          path: dist/artifacts/*
          if-no-files-found: error
