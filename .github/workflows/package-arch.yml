name: Package Arch Linux (.pkg.tar.zst & PKGBUILD)

on:
  workflow_dispatch:
    inputs:
      architecture:
        description: 'Arch Linux architecture to package'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'x86_64'
          - 'aarch64'

permissions:
  contents: read

jobs:
  package-arch:
    name: Package Arch (${{ matrix.arch }})
    runs-on: ubuntu-latest
    if: inputs.architecture == 'all' || inputs.architecture == matrix.arch
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            arch: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd tar

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        uses: taiki-e/install-action@cross

      - name: Build target binary
        run: |
          cross build --release --target ${{ matrix.target }}

      - name: Build Arch Linux package & export PKGBUILD
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist/artifacts

          # Build .pkg.tar.zst package
          ./scripts/packaging/arch/pkg-tzg.sh \
            --binary "target/${{ matrix.target }}/release/tilo" \
            --arch "${{ matrix.arch }}" \
            --out-dir dist/artifacts

          # Export PKGBUILD with target version
          sed -E "s/^pkgver=.*/pkgver=${VERSION}/" scripts/packaging/arch/PKGBUILD > dist/artifacts/PKGBUILD
          tar -czf dist/artifacts/tilo-${VERSION}-PKGBUILD.tar.gz -C dist/artifacts PKGBUILD

          cd dist/artifacts
          sha256sum * > SHA256SUMS

      - name: Upload Arch Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilo-arch-${{ matrix.arch }}
          path: dist/artifacts/*
          if-no-files-found: error
